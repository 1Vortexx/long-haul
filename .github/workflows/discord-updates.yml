# Posts repo updates (pushes, releases, pull requests) to a Discord channel.
# Setup: in Discord, Channel settings > Integrations > Webhooks > New Webhook,
# copy its URL, then run:  gh secret set DISCORD_WEBHOOK_URL -R 1Vortexx/long-haul
name: Discord updates

on:
  push:
  release:
    types: [published]
  pull_request:
    types: [opened, closed, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_WEBHOOK_URL secret not set"; exit 1; fi
          E="$GITHUB_EVENT_PATH"
          case "$EVENT" in
            push)
              BRANCH="${GITHUB_REF#refs/heads/}"
              COUNT=$(jq '.commits | length' "$E")
              [ "$COUNT" -eq 0 ] && exit 0
              PAYLOAD=$(jq --arg b "$BRANCH" '{
                username: "Long Haul Updates",
                embeds: [{
                  title: "\(.commits|length) new commit\(if (.commits|length)==1 then "" else "s" end) to \($b)",
                  url: .compare,
                  color: 15105570,
                  author: {name: .sender.login, icon_url: .sender.avatar_url},
                  description: ([.commits[-10:][] | "[`\(.id[0:7])`](\(.url)) \(.message|split("\n")[0]|.[0:120])"] | join("\n")),
                  timestamp: .head_commit.timestamp
                }]}' "$E") ;;
            release)
              PAYLOAD=$(jq '{
                username: "Long Haul Updates",
                embeds: [{
                  title: "Release: \(.release.name // .release.tag_name)",
                  url: .release.html_url,
                  color: 5763719,
                  author: {name: .sender.login, icon_url: .sender.avatar_url},
                  description: ((.release.body // "")[0:3500])
                }]}' "$E") ;;
            pull_request)
              PAYLOAD=$(jq '{
                username: "Long Haul Updates",
                embeds: [{
                  title: "PR #\(.number) \(if .action=="closed" and .pull_request.merged then "merged" else .action end): \(.pull_request.title)",
                  url: .pull_request.html_url,
                  color: 3447003,
                  author: {name: .sender.login, icon_url: .sender.avatar_url}
                }]}' "$E") ;;
          esac
          curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
